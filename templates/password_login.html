{% extends "template.html" %}
{% block content %}
<div id="main-wrap">
<main class="page-menu legal-page">
<aside></aside>
<div class="guide legal-doc account-action">
<section class="account-action__panel">
    <h1>{% trans %}Sign in{% endtrans %}</h1>
    {% if auth_error %}<p class="account-action__lead" role="alert"><strong>{{ auth_error }}</strong></p>{% endif %}
    <form class="account-action__form" method="post" action="/login">
        <input type="hidden" name="_csrf_token" value="{{ csrf_token }}">
        <div class="account-action__field">
            <label class="account-action__label" for="login-username">{% trans %}Username{% endtrans %}</label>
            <input id="login-username" class="account-action__input" type="text" name="username" value="{{ auth_username }}" autocomplete="username" autofocus required>
        </div>
        <div class="account-action__field">
            <label class="account-action__label" for="login-password">{% trans %}Password{% endtrans %}</label>
            <input id="login-password" class="account-action__input" type="password" name="password" autocomplete="current-password" required>
        </div>
        <div class="account-action__actions">
            <button class="account-action__button" type="submit">{% trans %}Sign in{% endtrans %}</button>
            <a class="account-action__button account-action__button--secondary" href="/signup">{% trans %}Need an account? Sign up{% endtrans %}</a>
        </div>
    </form>
</section>
</div>
</main>
</div>
{% endblock %}
{% block js %}
<script src="{{ js }}"></script>
{% endblock %}
